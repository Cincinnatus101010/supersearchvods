[project]
name = "supersearch"
version = "0.1.0"
description = "Search YouTube and Twitch VODs by transcript — find moments to clip"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp[default]>=2026.3.17",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2.1"]

[project.scripts]
supersearch = "supersearch.cli:main"
supersearch-api = "supersearch.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["supersearch"]

[tool.setuptools.package-dir]
supersearch = "src"

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["supersearch", "tests"]
